name: AskIT CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Hardcoded UI strings
        run: python3 scripts/check_hardcoded_strings.py

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Lint
        run: ./gradlew lintDebug lintRelease

      - name: Unit tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest

      - name: Screenshot tests (Roborazzi)
        # Baselines are recorded on this runner (Robolectric native graphics has no linux-aarch64
        # build). Until they are committed, record them and publish them as an artifact.
        run: |
          if compgen -G "app/src/testDebug/screenshots/*.png" > /dev/null && \
             compgen -G "designsystem/src/test/screenshots/*.png" > /dev/null; then
            ./gradlew verifyRoborazziDebug
          else
            echo "::warning::No Roborazzi baselines committed yet; recording them. Commit the roborazzi-baselines artifact."
            ./gradlew recordRoborazziDebug
          fi

      - name: Upload recorded screenshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-baselines
          path: |
            app/src/testDebug/screenshots/
            designsystem/src/test/screenshots/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Assemble release
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
